# golangci-lint v2 configuration for the rules in skills/go-best-practices.
# Copy it to the module root as .golangci.yml. Checked against golangci-lint 2.15 and Go 1.27.
version: "2"

linters:
  default: none
  enable:
    # Bugs and leaks
    - bodyclose
    - errcheck
    - forcetypeassert
    - govet
    - ineffassign
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
    - wastedassign
    # Errors
    - errname
    - errorlint
    # Context and concurrency
    - containedctx
    - contextcheck
    - fatcontext
    - noctx
    # API shape and style
    - exhaustive
    - gocritic
    - iface
    - recvcheck
    - revive
    - unconvert
    - unparam
    # Modern Go and the standard library
    - exptostd
    - modernize
    - usestdlibvars
    - usetesting
    # Logging, tests, security, and suppressions
    - gosec
    - misspell
    - nolintlint
    - sloglint
    - thelper

  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: true
    govet:
      enable-all: true
      disable:
        - fieldalignment # memory layout, not correctness
        - shadow # flags the idiomatic `if err := f(); err != nil`
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: early-return
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: flag-parameter
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: use-any
        - name: var-declaration
        - name: var-naming
    sloglint:
      attr-only: false
      context: scope
      key-naming-case: snake
      no-mixed-args: true
      static-msg: true

  exclusions:
    presets:
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - containedctx
          - errcheck
          - forcetypeassert
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
