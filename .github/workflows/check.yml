name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versions agree with versions.toml
        run: python3 scripts/check-versions.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: scripts/lint-fixture/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - name: Skills are well formed
        run: python3 scripts/check-skill.py
      - name: Go examples type-check
        run: python3 scripts/check-examples.py
      - name: Every enabled linter reports its fixture violation
        run: sh scripts/check-lints.sh
      - name: Rule table matches the tools
        run: python3 scripts/check-rules.py
      - name: Eval harness prepares its folders
        run: python3 evals/grade.py --prepare "$(mktemp -d)"
