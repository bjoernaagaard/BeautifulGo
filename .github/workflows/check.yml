name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Skills are well formed
        run: python3 scripts/check-skill.py
      - name: Go examples type-check
        run: python3 scripts/check-examples.py
      - name: Lint configuration reports its fixture
        run: sh scripts/check-lints.sh
